<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="560" viewBox="0 0 1720 560" role="img" aria-labelledby="title description">
  <title id="title">CLP connector boundary between the Presto Java coordinator and Presto Native worker</title>
  <desc id="description">The CLP coordinator plugin queries a metastore for files and statistics, then exchanges metadata and split information with the Presto coordinator. Presto sends plans, serialized handles, and splits to Presto Native workers. A dynamically loaded CLP Native worker plugin searches compressed CLP KV-IR and compressed CLP archives in object storage. Result pages return through Presto.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .group-title { font-size: 24px; font-weight: 700; }
      .box-title { font-size: 22px; font-weight: 700; }
      .storage-title { font-size: 19px; font-weight: 700; }
      .box-detail { font-size: 17px; fill: #334155; }
      .edge-label { font-size: 16px; font-weight: 700; fill: #334155; }
      .small-label { font-size: 15px; font-weight: 600; fill: #475569; }
      .transport-label { font-size: 18px; font-weight: 700; fill: #1d4ed8; }
      .transport-detail { font-size: 16px; font-weight: 700; fill: #334155; }
      .connector-label { font-size: 18px; font-weight: 700; fill: #334155; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .interface { fill: none; stroke: #334155; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .load { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect x="1" y="1" width="1718" height="558" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="20" y="142" width="140" height="100" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="90" y="183" text-anchor="middle" class="box-title">SQL client</text>
  <text x="90" y="214" text-anchor="middle" class="box-detail">Query · results</text>

  <rect x="320" y="55" width="420" height="450" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="530" y="98" text-anchor="middle" class="group-title">Presto Java Coordinator</text>

  <rect x="355" y="142" width="350" height="112" rx="13" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="530" y="184" text-anchor="middle" class="box-title">Presto Coordinator</text>
  <text x="530" y="217" text-anchor="middle" class="box-detail">Planner · optimizer · scheduler</text>

  <rect x="355" y="350" width="350" height="112" rx="13" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="530" y="392" text-anchor="middle" class="box-title">CLP Coordinator Plugin</text>
  <text x="530" y="425" text-anchor="middle" class="box-detail">Metadata · splits · handle codecs</text>

  <rect x="20" y="350" width="140" height="112" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="90" y="390" text-anchor="middle" class="box-title">Metastore</text>
  <text x="90" y="420" text-anchor="middle" class="small-label">File metadata</text>
  <text x="90" y="444" text-anchor="middle" class="small-label">Bounds · stats</text>
  <path d="M 173 406 L 342 406" class="interface"/>

  <path d="M 530 267 L 530 337" class="interface"/>
  <rect x="550" y="283" width="140" height="38" rx="8" fill="#ffffff"/>
  <text x="620" y="309" text-anchor="middle" class="connector-label">Connector SPI</text>

  <rect x="950" y="55" width="420" height="450" rx="18" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
  <text x="1160" y="98" text-anchor="middle" class="group-title">Presto Native Workers</text>

  <rect x="985" y="142" width="350" height="112" rx="13" fill="#e7f8f4" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1160" y="184" text-anchor="middle" class="box-title">Presto Native Execution</text>
  <text x="1160" y="217" text-anchor="middle" class="box-detail">Plan execution · result pages</text>

  <rect x="985" y="350" width="350" height="112" rx="13" fill="#e7f8f4" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1160" y="392" text-anchor="middle" class="box-title">CLP Native Worker Plugin</text>
  <text x="1160" y="425" text-anchor="middle" class="box-detail">connector.so · native scan</text>

  <path d="M 1160 267 L 1160 337" class="interface"/>
  <rect x="1180" y="283" width="155" height="38" rx="8" fill="#ffffff"/>
  <text x="1257.5" y="309" text-anchor="middle" class="connector-label">Connector API</text>

  <rect x="984" y="281" width="150" height="42" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1059" y="309" text-anchor="middle" class="connector-label">Plugin Loader</text>
  <path d="M 1059 323 L 1059 350" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <rect x="208" y="145" width="64" height="27" rx="7" fill="#ffffff"/>
  <path d="M 173 182 L 342 182" class="flow"/>
  <text x="240" y="164" text-anchor="middle" class="transport-detail">Query</text>
  <rect x="205" y="186" width="70" height="26" rx="7" fill="#ffffff"/>
  <text x="240" y="205" text-anchor="middle" class="transport-label">HTTP/S</text>
  <path d="M 355 216 L 173 216" class="flow"/>
  <rect x="206" y="224" width="68" height="28" rx="7" fill="#ffffff"/>
  <text x="240" y="244" text-anchor="middle" class="transport-detail">Results</text>

  <rect x="750" y="141" width="190" height="32" rx="7" fill="#ffffff"/>
  <text x="845" y="164" text-anchor="middle" class="transport-detail">Plan · handles · splits</text>
  <path d="M 718 182 L 972 182" class="flow"/>

  <rect x="760" y="186" width="170" height="26" rx="7" fill="#ffffff"/>
  <text x="845" y="205" text-anchor="middle" class="transport-label">Presto Transport</text>

  <path d="M 972 216 L 718 216" class="flow"/>
  <rect x="780" y="224" width="130" height="31" rx="7" fill="#ffffff"/>
  <text x="845" y="247" text-anchor="middle" class="transport-detail">Result pages</text>

  <rect x="1440" y="55" width="247" height="450" rx="18" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
  <text x="1563.5" y="98" text-anchor="middle" class="group-title">Object Storage</text>

  <rect x="1462" y="142" width="203" height="112" rx="12" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/>
  <text x="1563.5" y="190" text-anchor="middle" class="storage-title">Compressed</text>
  <text x="1563.5" y="219" text-anchor="middle" class="storage-title">CLP KV-IR</text>

  <rect x="1462" y="350" width="203" height="112" rx="12" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/>
  <text x="1563.5" y="398" text-anchor="middle" class="storage-title">Compressed</text>
  <text x="1563.5" y="427" text-anchor="middle" class="storage-title">CLP Archives</text>

  <path d="M 1440 406 L 1348 406" class="flow"/>
</svg>
