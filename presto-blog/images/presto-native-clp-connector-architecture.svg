<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">CLP connector boundary between the Presto Java coordinator and Presto Native worker</title>
  <desc id="description">The CLP Java plugin exchanges metadata and split information with the Presto coordinator. Presto sends plans, serialized handles, and splits to Presto Native workers. A dynamically loaded CLP connector scans KV-IR files and immutable archives, and result pages return through Presto.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .group-title { font-size: 24px; font-weight: 700; }
      .box-title { font-size: 22px; font-weight: 700; }
      .box-detail { font-size: 17px; fill: #334155; }
      .edge-label { font-size: 17px; font-weight: 600; fill: #334155; }
      .small-label { font-size: 15px; font-weight: 600; fill: #475569; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .interface { fill: none; stroke: #334155; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .load { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="598" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="24" y="152" width="156" height="92" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="102" y="191" text-anchor="middle" class="box-title">SQL client</text>
  <text x="102" y="219" text-anchor="middle" class="box-detail">Query · results</text>

  <rect x="220" y="58" width="480" height="484" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="250" y="100" class="group-title">Java coordinator</text>

  <rect x="275" y="142" width="370" height="112" rx="13" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="460" y="184" text-anchor="middle" class="box-title">Presto coordinator</text>
  <text x="460" y="217" text-anchor="middle" class="box-detail">Planner · optimizer · scheduler</text>

  <rect x="275" y="356" width="370" height="112" rx="13" fill="#eaf2ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="460" y="398" text-anchor="middle" class="box-title">CLP Java plugin</text>
  <text x="460" y="431" text-anchor="middle" class="box-detail">Metadata · splits · handle codecs</text>

  <path d="M 460 267 L 460 343" class="interface"/>
  <rect x="487" y="286" width="116" height="34" rx="8" fill="#ffffff"/>
  <text x="545" y="309" text-anchor="middle" class="small-label">Connector SPI</text>

  <rect x="880" y="58" width="480" height="484" rx="18" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
  <text x="910" y="100" class="group-title">Presto Native worker</text>

  <rect x="935" y="142" width="370" height="112" rx="13" fill="#e7f8f4" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1120" y="184" text-anchor="middle" class="box-title">Presto Native execution</text>
  <text x="1120" y="217" text-anchor="middle" class="box-detail">Plan execution · result pages</text>

  <rect x="935" y="356" width="370" height="112" rx="13" fill="#e7f8f4" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1120" y="398" text-anchor="middle" class="box-title">CLP connector .so</text>
  <text x="1120" y="431" text-anchor="middle" class="box-detail">Handle adapter · native scan</text>

  <path d="M 1120 267 L 1120 343" class="interface"/>
  <rect x="1147" y="286" width="148" height="34" rx="8" fill="#ffffff"/>
  <text x="1221" y="309" text-anchor="middle" class="small-label">Connector API</text>

  <rect x="941" y="282" width="126" height="42" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1004" y="309" text-anchor="middle" class="small-label">Plugin loader</text>
  <path d="M 1004 325 L 1004 346" class="load"/>

  <path d="M 180 176 L 264 176" class="flow"/>
  <text x="222" y="164" text-anchor="middle" class="small-label">Query</text>
  <path d="M 275 220 L 189 220" class="flow"/>
  <text x="232" y="244" text-anchor="middle" class="small-label">Results</text>

  <path d="M 645 174 L 935 174" class="flow"/>
  <rect x="701" y="132" width="178" height="31" rx="7" fill="#ffffff"/>
  <text x="790" y="154" text-anchor="middle" class="edge-label">Presto-managed path</text>
  <text x="790" y="201" text-anchor="middle" class="small-label">Plan · serialized handles · splits</text>

  <path d="M 935 229 L 645 229" class="flow"/>
  <text x="790" y="256" text-anchor="middle" class="small-label">Result pages</text>

  <rect x="1410" y="343" width="166" height="138" rx="13" fill="#fff7e6" stroke="#b45309" stroke-width="2.5"/>
  <text x="1493" y="381" text-anchor="middle" class="box-title">Object storage</text>
  <text x="1493" y="416" text-anchor="middle" class="box-detail">Compressed KV-IR</text>
  <text x="1493" y="445" text-anchor="middle" class="box-detail">CLP archives</text>

  <path d="M 1318 412 L 1397 412" class="interface"/>
</svg>
